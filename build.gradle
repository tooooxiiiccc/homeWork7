plugins {
    id 'java'
    id("io.qameta.allure") version "3.0.0"
}

group = 'org.example'
version = '1.0-SNAPSHOT'

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'com.codeborne:selenide:7.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.assertj:assertj-core:3.27.4'
    testImplementation 'io.qameta.allure:allure-junit5:2.24.0'
    testImplementation 'io.qameta.allure:allure-selenide:2.24.0'
    // testImplementation 'io.github.bonigarcia:webdrivermanager:5.8.0'
}

test {
    useJUnitPlatform {
        if (project.hasProperty('tag')) {
            includeTags project.property('tag')
        }
    }
    
    testLogging {
        events "passed", "skipped", "failed", "started"
        exceptionFormat "full"
        showStandardStreams = true
        showExceptions = true
        showCauses = true
        showStackTraces = true
        displayGranularity = 2
    }
    
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "\n=== Test Summary ==="
            println "Tests found: ${result.testCount}"
            println "Tests run: ${result.testCount - result.skippedTestCount}"
            println "Tests passed: ${result.successfulTestCount}"
            println "Tests failed: ${result.failedTestCount}"
            println "Tests skipped: ${result.skippedTestCount}"
            println "===================\n"
        }
    }
    
    systemProperties += [
            'junit.jupiter.execution.parallel.enabled'                 : true,
            'junit.jupiter.execution.parallel.mode.default'            : 'concurrent',
            'junit.jupiter.execution.parallel.mode.classes.default'    : 'concurrent',
            'junit.jupiter.execution.parallel.config.strategy'         : 'fixed',
            'junit.jupiter.execution.parallel.config.fixed.parallelism': System.getProperty('parallel.threads', '4'),
            // Отключаем WebDriverManager при использовании remote
            'wdm.chromeDriverVersion'                                  : '',
            'wdm.architecture'                                         : ''
    ]
}

allure {
    version = "2.24.0"
    report {
        reportDir = file("build/reports/allure-report")
    }
}